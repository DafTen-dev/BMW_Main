<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="registration.css">
   
</head>
<body>

<div class="register-card">
    <h1>Registration</h1>
    <p class="subtitle">Fill in the details to create your account</p>

    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Choose a username">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="your.email@gmail.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter your password">
        </div>

        <div class="form-group">
            <label>Re-enter Password</label>
            <input type="password" name="confirm_password" required placeholder="Confirm your password">
        </div>

        <div class="terms-group">
            <input type="checkbox" name="terms" id="terms" required>
            <label for="terms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a></label>
        </div>

        <button type="submit" class="register-btn">Register Now</button>

    </form>
</div>

</body>
</html>
